<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rohit - Web Developer</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins','Segoe UI',sans-serif;}
  body{min-height:100vh;display:flex;justify-content:center;align-items:center;background:#0b1220;padding:20px;}
  .card{width:100%;max-width:380px;background:#ffffff;border-radius:28px;overflow:hidden;box-shadow:0 30px 60px rgba(0,0,0,0.5);position:relative;}
  .banner{height:140px;background:linear-gradient(135deg, #4f46e5 0%, #06b6d4 50%, #8b5cf6 100%);position:relative;}
  .banner::after{content:'';position:absolute;bottom:-20px;left:0;width:100%;height:40px;background:white;border-radius:30px 30px 0 0;}
  .avatar{width:96px;height:96px;margin:-48px auto 0;background:linear-gradient(135deg,#4f46e5,#06b6d4);border-radius:50%;display:flex;justify-content:center;align-items:center;color:white;font-size:40px;font-weight:800;border:4px solid white;box-shadow:0 10px 25px rgba(79,70,229,0.4);position:relative;z-index:2;}
  .info{text-align:center;padding:16px 24px 10px;}
  .info h1{font-size:24px;color:#0f172a;letter-spacing:-0.5px;}
  .info h3{font-size:12px;color:#4f46e5;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;margin:6px 0;}
  .info .uni{font-size:12.5px;color:#64748b;margin-top:8px;line-height:1.4;}
  .skills{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;padding:18px 20px;}
  .skill{padding:7px 14px;border-radius:100px;font-size:11px;font-weight:700;background:#f1f5f9;color:#334155;border:1px solid #e2e8f0;}
  .skill.highlight{background:#eef2ff;color:#4f46e5;border-color:#c7d2fe;}
  .stats{display:flex;justify-content:space-around;background:#f8fafc;border-top:1px solid #f1f5f9;border-bottom:1px solid #f1f5f9;padding:14px 0;}
  .stat b{display:block;font-size:16px;color:#0f172a;}
  .stat span{font-size:11px;color:#64748b;font-weight:600;}
  .contact-list{padding:16px 22px;display:flex;flex-direction:column;gap:10px;}
  .c-item{display:flex;align-items:center;gap:12px;font-size:13px;color:#334155;text-decoration:none;background:#f8fafc;padding:10px 14px;border-radius:12px;transition:0.2s;}
  .c-item i{width:32px;height:32px;background:white;border-radius:8px;display:flex;justify-content:center;align-items:center;color:#4f46e5;box-shadow:0 2px 6px rgba(0,0,0,0.06);}
  .c-item:hover{background:#eef2ff;transform:translateX(4px);}
  .actions{padding:20px;display:flex;gap:12px;}
  .btn{flex:1;padding:13px;border-radius:14px;border:none;font-weight:700;font-size:13px;cursor:pointer;transition:0.2s;display:flex;justify-content:center;align-items:center;gap:8px;text-decoration:none;}
  .btn-primary{background:#0f172a;color:white;}
  .btn-secondary{background:white;border:1.5px solid #e2e8f0;color:#0f172a;}
  .btn:hover{transform:translateY(-2px);box-shadow:0 10px 20px rgba(0,0,0,0.15);}
</style>
</head>
<body>

<div class="card">
  <div class="banner"></div>
  <div class="avatar">R</div>
  
  <div class="info">
    <h1 id="name">Rohit Kumar</h1>
    <h3>Computer Science Engineering • Web Developer</h3>
    <p class="uni"><i class="fa-solid fa-building-columns"></i> Dr. APJ Abdul Kalam Technical University, Lucknow</p>
  </div>

  <div class="skills">
    <span class="skill highlight">HTML</span>
    <span class="skill highlight">CSS</span>
    <span class="skill highlight">JavaScript</span>
    <span class="skill highlight">Python</span>
    <span class="skill">Machine Learning</span>
  </div>

  <div class="stats">
    <div class="stat"><b>10+</b><span>Projects</span></div>
    <div class="stat"><b>4</b><span>Skills</span></div>
    <div class="stat"><b>AKTU</b><span>University</span></div>
  </div>

  <div class="contact-list">
    <a class="c-item" href="tel:7052322593"><i class="fa-solid fa-phone"></i> 7052322593</a>
    <a class="c-item" href="mailto:orhit705@gmail.com"><i class="fa-solid fa-envelope"></i> orhit705@gmail.com</a>
    <a class="c-item" href="https://www.linkedin.com/in/rohit-kumar-47b5b6327" target="_blank"><i class="fa-brands fa-linkedin-in"></i> linkedin.com/in/rohit-kumar</a>
  </div>

  <div class="actions">
    <a class="btn btn-primary" href="https://www.linkedin.com/in/rohit-kumar-47b5b6327" target="_blank"><i class="fa-brands fa-linkedin"></i> LinkedIn</a>
    <button class="btn btn-secondary" onclick="shareCard()"><i class="fa-solid fa-share-nodes"></i> Share</button>
  </div>
</div>

<script>
  function shareCard(){
    if(navigator.share){
      navigator.share({
        title: 'Rohit - Portfolio',
        text: 'Check out Rohit - Web Developer from AKTU',
        url: window.location.href
      });
    } else {
      navigator.clipboard.writeText(window.location.href);
      alert('Link Copied! Aap isse kahi bhi share kar sakte ho.');
    }
  }
  // Welcome animation
  document.querySelector('.card').addEventListener('click', function(e){
    if(e.target.closest('.c-item') || e.target.closest('.btn')) return;
    this.style.transform = 'scale(0.98)';
    setTimeout(()=> this.style.transform='scale(1)', 150);
  });
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Internship Portal</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--primary:#2563b;--primary-light:#dbeafe;--dark:#0f172a;--muted:#64748b;--bg:#f6f7fb;--white:#fff;--border:#e2e8f0;--green:#dcfce7;--green-t:#166534}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Plus Jakarta Sans',sans-serif}
body{background:var(--bg);color:var(--dark)}
/* Header */
header{background:var(--white);padding:14px 6%;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10;box-shadow:0 2px 12px rgba(0,0,0,.06)}
.logo{font-weight:800;font-size:20px} .logo b{color:var(--primary)}
.task-info{background:var(--primary-light);padding:6px 12px;border-radius:20px;font-size:12px;font-weight:700;color:var(--primary)}
/* Hero & Search */
.hero{background:linear-gradient(135deg,#0f172a,#1e40af);color:#fff;padding:50px 6% 80px;text-align:center}
.hero h1{font-size:42px;margin-bottom:10px} .hero p{opacity:.8;font-size:17px}
.search-wrapper{background:var(--white);display:flex;flex-wrap:wrap;gap:10px;padding:12px;border-radius:16px;max-width:1000px;margin:30px auto -80px;box-shadow:0 20px 40px rgba(0,0,0,.15)}
.search-wrapper input,.search-wrapper select{flex:1;min-width:160px;padding:14px 16px;border:1px solid var(--border);border-radius:10px;font-size:14px;outline:none}
.search-wrapper input:focus{border-color:var(--primary)}
.btn{padding:14px 22px;border:none;border-radius:10px;background:var(--primary);color:#fff;font-weight:700;cursor:pointer}
.btn:hover{background:#1d4ed8}
/* Layout */
.main{display:flex;gap:24px;padding:60px 6% 40px;max-width:1400px;margin:auto}
.jobs-list{flex:1.2}
.job-count{margin-bottom:16px;color:var(--muted);font-weight:600}
.card{background:var(--white);border:1px solid var(--border);border-radius:16px;padding:20px;margin-bottom:16px;cursor:pointer;transition:.2s}
.card:hover{border-color:var(--primary);transform:translateY(-2px);box-shadow:0 8px 20px rgba(37,99,235,.1)}
.card.active{border:2px solid var(--primary);background:#f0f6ff}
.card-head{display:flex;gap:14px;align-items:center}
.card-head img{width:48px;height:48px;border-radius:12px}
.tags{display:flex;gap:8px;margin:12px 0;flex-wrap:wrap}
.tag{font-size:11px;font-weight:700;padding:5px 10px;border-radius:20px;background:#f1f5f9}
.tag.remote{background:var(--primary-light);color:var(--primary)} .tag.salary{background:var(--green);color:var(--green-t)}
.card-foot{display:flex;justify-content:space-between;align-items:center;margin-top:10px;color:var(--muted);font-size:13px}
/* Detail Panel */
.detail-panel{flex:0.8;background:var(--white);border-radius:16px;border:1px solid var(--border);padding:26px;position:sticky;top:90px;height:fit-content;max-height:85vh;overflow:auto}
.detail-panel h2{font-size:22px} .detail-panel .desc{color:#334155;line-height:1.6;margin:14px 0;font-size:14.5px}
.detail-panel ul{margin:12px 0 12px 18px;color:#334155;font-size:14px;line-height:1.8}
.apply-box{margin-top:20px;padding:16px;background:var(--bg);border-radius:12px;display:flex;justify-content:space-between;align-items:center}
.mobile-show{display:none}
/* Responsive */
@media(max-width:900px){
  .main{flex-direction:column}
  .detail-panel{position:fixed;inset:0;z-index:50;border-radius:0;display:none;max-height:100vh}
  .detail-panel.open{display:block}
  .mobile-show{display:block}
  .hero h1{font-size:32px}
}
</style>
</head>
<body>

<header>
  <div class="logo"><b>Internship-port </b>
  
</header>

<section class="hero">
  <h1>Find Your Next Job</h1>
  <p>Explore 5000+ verified jobs from top companies</p>
  <div class="search-wrapper">
    <input type="text" id="searchTitle" placeholder="Job title, company or skill..." onkeyup="renderJobs()">
    <select id="filterLocation" onchange="renderJobs()"><option value="">All Locations</option><option>Remote</option><option>Bangalore</option><option>Delhi</option><option>Hyderabad</option><option>Mumbai</option></select>
    <select id="filterType" onchange="renderJobs()"><option value="">All Types</option><option>Full-time</option><option>Part-time</option><option>Internship</option><option>Contract</option></select>
    <select id="filterSalary" onchange="renderJobs()"><option value="">Any Salary</option><option value="30000">Above 30k</option><option value="50000">Above 50k</option><option value="80000">Above 80k</option></select>
    <button class="btn" onclick="renderJobs()">Search</button>
  </div>
</section>

<div class="main">
  <div class="jobs-list">
    <div class="job-count" id="jobCount"></div>
    <div id="jobsContainer"></div>
  </div>
  <div class="detail-panel" id="detailPanel">
    <p style="color:var(--muted);text-align:center;margin-top:50px">Select a job to view details</p>
  </div>
</div>

<script>
const jobs=[
{id:1,title:"Frontend Developer",company:"Google",logo:"https://logo.clearbit.com/google.com",location:"Bangalore",type:"Full-time",salary:95000,exp:"1-3 Years",posted:"2h ago",skills:["React","TypeScript","Tailwind"],desc:"Build next-gen UI for Google products. Work with UX team and ship high-performance web apps.",resp:["Develop responsive interfaces","Optimize performance","Collaborate with backend team"]},
{id:2,title:"UI/UX Designer",company:"Figma",logo:"https://logo.clearbit.com/figma.com",location:"Remote",type:"Full-time",salary:75000,exp:"0-2 Years",posted:"5h ago",skills:["Figma","Prototyping","User Research"],desc:"Design intuitive experiences used by millions of designers worldwide.",resp:["Create wireframes & prototypes","Conduct user testing","Maintain design system"]},
{id:3,title:"Backend Engineer",company:"Amazon",logo:"https://logo.clearbit.com/amazon.com",location:"Hyderabad",type:"Full-time",salary:110000,exp:"2-4 Years",posted:"1d ago",skills:["Node.js","AWS","MongoDB"],desc:"Build scalable microservices powering Amazon Prime.",resp:["Design REST APIs","Handle AWS deployment","Ensure security"]},
{id:4,title:"Digital Marketing Intern",company:"Zomato",logo:"https://logo.clearbit.com/zomato.com",location:"Delhi",type:"Internship",salary:15000,exp:"Fresher",posted:"3h ago",skills:["SEO","Content","Analytics"],desc:"Internship with live campaign handling.",resp:["Run social campaigns","Analyze traffic"]},
{id:5,title:"Data Analyst",company:"Microsoft",logo:"https://logo.clearbit.com/microsoft.com",location:"Mumbai",type:"Contract",salary:85000,exp:"1-2 Years",posted:"6h ago",skills:["Python","SQL","Power BI"],desc:"Analyze business data and create dashboards.",resp:["Create reports","Data visualization"]},
{id:6,title:"Product Manager",company:"Swiggy",logo:"https://logo.clearbit.com/swiggy.com",location:"Bangalore",type:"Full-time",salary:120000,exp:"3-5 Years",posted:"10h ago",skills:["Product","Agile","Roadmap"],desc:"Own product lifecycle for Swiggy Instamart.",resp:["Define roadmap","Work with eng & design"]}
];

let selectedId=null;
function renderJobs(){
 let q=document.getElementById('searchTitle').value.toLowerCase();
 let loc=document.getElementById('filterLocation').value;
 let typ=document.getElementById('filterType').value;
 let sal=document.getElementById('filterSalary').value;
 let filtered=jobs.filter(j=>{
  return (j.title.toLowerCase().includes(q)||j.company.toLowerCase().includes(q)||j.skills.join(' ').toLowerCase().includes(q)) &&
  (loc==''||j.location==loc) &&
  (typ==''||j.type==typ) &&
  (sal==''||j.salary>=parseInt(sal));
 });
 document.getElementById('jobCount').innerText=`${filtered.length} Jobs Found`;
 document.getElementById('jobsContainer').innerHTML=filtered.map(j=>`
  <div class="card ${selectedId==j.id?'active':''}" onclick="showDetail(${j.id})">
    <div class="card-head"><img src="${j.logo}"><div><h3>${j.title}</h3><p style="font-size:13px;color:#64748b">${j.company} • ⭐ 4.8</p></div></div>
    <div class="tags"><span class="tag remote">${j.type}</span><span class="tag">${j.location}</span><span class="tag salary">₹${(j.salary/1000)}k/mo</span><span class="tag">${j.exp}</span></div>
    <div style="font-size:13px">${j.skills.map(s=>`#${s}`).join(' ')}</div>
    <div class="card-foot"><span>📍 ${j.location}</span><span>🕒 ${j.posted}</span></div>
  </div>
 `).join('') || '<p>No jobs found</p>';
}

function showDetail(id){
 selectedId=id;
 renderJobs();
 let j=jobs.find(x=>x.id==id);
 document.getElementById('detailPanel').innerHTML=`
  <button class="btn mobile-show" style="margin-bottom:16px;background:#e2e8f0;color:#000" onclick="closeDetail()">← Back to Jobs</button>
  <div style="display:flex;gap:14px;align-items:center"><img src="${j.logo}" style="width:56px;height:56px;border-radius:14px"><div><h2>${j.title}</h2><p style="color:#64748b">${j.company} • ${j.location} • ${j.posted}</p></div></div>
  <div class="tags"><span class="tag remote">${j.type}</span><span class="tag">${j.exp}</span><span class="tag salary">₹${j.salary.toLocaleString()}/mo</span></div>
  <p class="desc">${j.desc}</p>
  <h4>Responsibilities</h4><ul>${j.resp.map(r=>`<li>${r}</li>`).join('')}</ul>
  <h4>Skills</h4><div class="tags">${j.skills.map(s=>`<span class="tag">${s}</span>`).join('')}</div>
  <div class="apply-box"><div><b>Salary: ₹${j.salary.toLocaleString()}/mo</b><br><small style="color:#64748b">Apply before 30 Sep 2026</small></div><button class="btn" onclick="alert('Application submitted for ${j.title} at ${j.company}!')">Apply Now</button></div>
 `;
 document.getElementById('detailPanel').classList.add('open');
 window.scrollTo({top:0,behavior:'smooth'});
}
function closeDetail(){document.getElementById('detailPanel').classList.remove('open');}
renderJobs();
</script>
</body>
</html>

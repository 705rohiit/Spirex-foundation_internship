<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Country Information App</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .card-container {
      background-color: #1e293b;
      width: 100%;
      max-width: 380px;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
      text-align: center;
    }

    h2 {
      margin-bottom: 20px;
      font-size: 1.5rem;
      color: #38bdf8;
    }

    .search-box {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }

    input {
      flex: 1;
      padding: 10px 14px;
      border-radius: 6px;
      border: 1px solid #334155;
      background-color: #0f172a;
      color: #fff;
      outline: none;
      font-size: 0.95rem;
    }

    button {
      padding: 10px 16px;
      border: none;
      background-color: #0284c7;
      color: #fff;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover {
      background-color: #0369a1;
    }

    .flag-img {
      width: 150px;
      height: 95px;
      object-fit: cover;
      border-radius: 6px;
      border: 1px solid #334155;
      margin-bottom: 15px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
    }

    .info-list {
      text-align: left;
      margin-top: 15px;
    }

    .info-item {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid #334155;
      font-size: 0.9rem;
    }

    .info-item span.label {
      color: #94a3b8;
    }

    .info-item span.value {
      color: #f1f5f9;
      font-weight: 600;
    }

    .error-msg {
      color: #f87171;
      font-size: 0.9rem;
      margin-top: 10px;
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>

  <div class="card-container">
    <h2>Country Information</h2>

    <div class="search-box">
      <input type="text" id="countryInput" value="India" placeholder="Enter country name...">
      <button onclick="fetchCountryData()">Search</button>
    </div>

    <p id="errorMsg" class="error-msg hidden"></p>

    <div id="detailsCard">
      <img id="flag" class="flag-img" src="" alt="Flag">
      <h3 id="countryName" style="margin-bottom: 15px;"></h3>

      <div class="info-list">
        <div class="info-item">
          <span class="label">Capital:</span>
          <span id="capital" class="value"></span>
        </div>
        <div class="info-item">
          <span class="label">Population:</span>
          <span id="population" class="value"></span>
        </div>
        <div class="info-item">
          <span class="label">Region:</span>
          <span id="region" class="value"></span>
        </div>
        <div class="info-item">
          <span class="label">Currency:</span>
          <span id="currency" class="value"></span>
        </div>
      </div>
    </div>
  </div>

  <script>
    async function fetchCountryData() {
      const countryName = document.getElementById('countryInput').value.trim();
      const errorMsg = document.getElementById('errorMsg');
      const detailsCard = document.getElementById('detailsCard');

      if (!countryName) {
        showError('Please enter a country name.');
        return;
      }

      try {
        const response = await fetch(`https://restcountries.com/v3.1/name/${encodeURIComponent(countryName)}`);

        if (!response.ok) {
          throw new Error('Country not found.');
        }

        const data = await response.json();
        const country = data[0];

        // Update Flag & Name
        document.getElementById('flag').src = country.flags?.svg || country.flags?.png || '';
        document.getElementById('countryName').innerText = country.name?.common || 'N/A';

        // Update Capital
        document.getElementById('capital').innerText = country.capital ? country.capital[0] : 'N/A';

        // Update Population
        document.getElementById('population').innerText = country.population
          ? country.population.toLocaleString()
          : 'N/A';

        // Update Region
        document.getElementById('region').innerText = country.region || 'N/A';

        // Update Currency
        if (country.currencies) {
          const currencyObj = Object.values(country.currencies)[0];
          document.getElementById('currency').innerText = `${currencyObj.name} (${currencyObj.symbol || ''})`;
        } else {
          document.getElementById('currency').innerText = 'N/A';
        }

        errorMsg.classList.add('hidden');
        detailsCard.classList.remove('hidden');
      } catch (error) {
        showError(error.message);
      }
    }

    function showError(msg) {
      const errorMsg = document.getElementById('errorMsg');
      const detailsCard = document.getElementById('detailsCard');
      errorMsg.innerText = msg;
      errorMsg.classList.remove('hidden');
      detailsCard.classList.add('hidden');
    }

    // Automatically load India on page load
    window.onload = fetchCountryData;
  </script>

</body>
</html>
